# v3TradeBot BOOTSTRAP configuration (example).
#
# Copy to configs/config.toml and pass it with the -config flag:
#   ./cmd/migrate -config configs/config.toml
# (default path is configs/config.toml when -config is omitted).
#
# This project reads configuration from this FILE ONLY — no environment
# variables. Bootstrap secrets that are needed before the database is reachable
# (the DB password inside the DSN, the Redis password, the master key) live here.
#
# IMPORTANT: this file holds ONLY bootstrap/infrastructure config. All TRADING
# configuration (exchanges, symbols, spreads, sizes, fees, retention, regime
# baskets, concurrency limits) AND all exchange API keys/secrets are stored in
# the database — API keys encrypted at rest — and edited from the dashboard, not
# here. See PROJECT_ARCHITECTURE.md.

[app]
# development | staging | production
environment = "development"

[log]
# debug | info | warn | error
level = "info"
# json | text
format = "json"

[mysql]
# REQUIRED. Go MySQL driver DSN (embeds the DB password). Target: MariaDB 10.6+.
# Keep this file out of version control (configs/config.toml is gitignored).
dsn = "trader:CHANGE_ME@tcp(127.0.0.1:3306)/v3tradebot?parseTime=true&loc=UTC"
# Pool sizing (0 = use built-in defaults: 25 / 10 / 30m / 5m).
max_open_conns = 0
max_idle_conns = 0
conn_max_lifetime_sec = 0
conn_max_idle_time_sec = 0

[redis]
# Live market data only. Losing Redis must not lose trading state.
addr = "127.0.0.1:6379"
password = ""
db = 0
pool_size = 0  # 0 = default 30

[dashboard]
listen_addr = "127.0.0.1:8080"
# PR17 login: bootstrap the first admin with (password read at a hidden prompt, NOT in args)
#   ./bin/dashboard -config <this file> -create-user admin:admin
secure_cookies = false      # set true when served over HTTPS (Secure cookie flag)
session_ttl_minutes = 720   # login session lifetime (default 12h)

[security]
# Master key used to encrypt at-rest secrets (exchange API credentials stored in
# the database) and to support masking of raw API logs. Set a strong value in
# real deployments and keep this file secret.
master_key = ""

[execution]
# Trade-execution mode (config-driven, NEVER a runtime env var). EXACTLY one of:
#   off     = no cycles/orders/requests/locks are created; nothing is sent (default, safest)
#   dry_run = SIMULATED clients only — full lifecycle, ZERO real exposure, no credentials
#   live    = real orders (gated by the PR20-PR25 safety stack)
# An empty value normalizes to "off"; any other value (e.g. a typo like "dryrun") is a
# hard startup error — it is never silently treated as "off".
mode = "off"

[execution.recovery]
# Ambiguous-mutation recovery window (PR19): when a PlaceOrder/CancelOrder response times
# out, the outcome is UNKNOWN — the order-executor never blindly retries the mutation, it
# probes read-only (GET_ORDER) with bounded exponential backoff + jitter until the real
# outcome is discovered OR this window is exhausted (then: NEEDS_RECONCILE, lock held).
# Durations are integer milliseconds. Zero/omitted fields take these safe defaults; negative
# or out-of-bounds values (max_attempts > 100, max_delay > 1h, total_timeout > 24h,
# max_delay < initial_delay) are hard startup errors.
max_attempts = 6
initial_delay_ms = 1000    # first retry after ~1s (jittered in [d/2, d])
max_delay_ms = 30000       # backoff cap: 1s, 2s, 4s, ... capped at 30s
total_timeout_ms = 300000  # give up (NEEDS_RECONCILE) after 5 minutes overall

# Per-exchange overrides for venues with slower order visibility. A PARTIAL override
# inherits every omitted field from the [execution.recovery] values above (never from
# hard-coded defaults). Example:
# [execution.recovery.per_exchange.nobitex]
# max_attempts = 10
# total_timeout_ms = 900000
